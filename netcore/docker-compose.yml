services:
  external-admin-main:
    build:
      context: ./src/ExternalAdmin.Main
      dockerfile: Dockerfile
    container_name: external-admin-main
    ports:
      - "5240:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    networks:
      - fanex-network
    restart: unless-stopped

