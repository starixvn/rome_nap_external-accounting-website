version: '3.8'

services:
  fanex-external-account-reports:
    build:
      context: ./src/Web/Fanex.ExternalAccount.Reports
      dockerfile: Dockerfile
    container_name: fanex-reports-prod
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      # Production database connections - Use secrets or external configs
      - ConnectionStrings__DBONUSER.ON_USER.wsv_xnap=${DB_ONUSER_CONNECTION}
      - ConnectionStrings__DBTXN.bodb02.wsv_xnap=${DB_TXN_CONNECTION}
      # Add other production connection strings...
      - Environment=Production
      - EnvTheme=prod
      - IsTest=0
      - IsCache=1
      - SystemId=4
      - Fanex.Customer:ServiceUri=${CUSTOMER_API_URL}
      - Fanex.Customer:CdnUri=${CUSTOMER_CDN_URL}
      - Fanex.Customer:SystemId=4
      - Redis:ConnectionString=${REDIS_CONNECTION}
    secrets:
      - db_password
      - redis_password
    networks:
      - fanex-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7.2-alpine
    container_name: fanex-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - fanex-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: fanex-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - fanex-external-account-reports
    networks:
      - fanex-prod-network
    restart: unless-stopped

secrets:
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt

volumes:
  redis_prod_data:
  nginx_logs:

networks:
  fanex-prod-network:
    driver: bridge
